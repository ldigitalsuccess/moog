<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0968dc">
    <meta name="description" content="MOOG is hatching. Meet the rabbit before the warren opens.">
    <title>MOOG</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main>
      <section class="hero" aria-labelledby="moog-title">
        <div class="hero__media" aria-hidden="true">
          <img class="hero__fallback" src="assets/moog-banner.png" alt="">
          <video id="hero-video" autoplay muted loop playsinline poster="assets/moog-banner.png">
            <source src="assets/moog-sky.mp4" type="video/mp4">
          </video>
          <div class="hero__wash"></div>
        </div>


        <nav class="topbar" aria-label="Primary navigation">
          <a class="wordmark" href="#top" aria-label="MOOG home">MOOG</a>
          <a class="topbar__link" href="#community">THE WARREN <span aria-hidden="true">↘</span></a>
        </nav>


        <div class="hero__content" id="top">
          <p class="eyebrow">THE RABBIT IS AWAKE</p>
          <h1 id="moog-title">MOOG</h1>
          <p class="hero__line">no leash. no map. just moog.</p>


          <div class="launch-card">
            <p class="launch-card__label" data-launch-copy role="status" aria-live="polite" aria-atomic="true">MOOG IS HATCHING IN</p>
            <div id="countdown" class="countdown" aria-label="Countdown to MOOG launch">
              <div class="countdown__unit"><strong data-unit="days">10</strong><span>days</span></div>
              <div class="countdown__unit"><strong data-unit="hours">00</strong><span>hours</span></div>
